[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "account-access-auditor"
version = "1.0.0"
description = "Read-only auditor for AWS IAM, S3, and CloudTrail access configuration."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["boto3>=1.34", "botocore>=1.34", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "moto[iam,s3,cloudtrail,sts]>=5.0", "ruff>=0.6"]

[project.scripts]
auditor = "auditor.cli:main"

[tool.setuptools]
packages = ["auditor", "auditor.collectors", "auditor.normalize", "auditor.models",
            "auditor.reporters", "auditor.rules", "auditor.utils"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are checked by line-length, not doubly
    "B008",    # not relevant here
    "SIM108",  # ternaries are not always clearer than an if/else
    # Severity deliberately subclasses (str, Enum) rather than StrEnum: the
    # mixin keeps Severity.HIGH == "HIGH" and JSON-serialisable, while the
    # class defines its own __str__, which StrEnum would fix in place.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Test modules intentionally shadow names and build long literal fixtures.
"tests/**" = ["E402", "B011"]
