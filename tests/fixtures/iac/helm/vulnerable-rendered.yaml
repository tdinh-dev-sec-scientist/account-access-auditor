apiVersion: apps/v1
kind: Deployment
metadata:
  name: unsafe-rendered-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unsafe-rendered-web
  template:
    metadata:
      labels:
        app: unsafe-rendered-web
    spec:
      containers:
        - name: web
          image: nginx:latest
          securityContext:
            privileged: true
      hostNetwork: true
