name: Publish IaC SARIF

on:
  workflow_run:
    workflows: ["IaC guardrails"]
    types: [completed]

permissions:
  actions: read
  security-events: write

concurrency:
  group: iac-sarif-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download scanner reports from the completed run
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: iac-guardrails-reports
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a SARIF report
        id: report
        if: always()
        shell: bash
        run: |
          if [[ -s reports/iac.sarif ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish same-repository pull request SARIF
        if: steps.report.outputs.available == 'true'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: reports/iac.sarif
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/merge
          sha: ${{ github.event.workflow_run.head_sha }}
          category: iac-guardrails
