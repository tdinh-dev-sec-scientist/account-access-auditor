name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install pinned IaC scanners for reproducible metrics
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --disable-pip-version-check -e . -r requirements-scanners.txt
          mkdir -p "$RUNNER_TEMP/conftest"
          curl --fail --silent --show-error --location \
            "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz" \
            --output "$RUNNER_TEMP/conftest/conftest_0.71.1_Linux_x86_64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/checksums.txt" \
            --output "$RUNNER_TEMP/conftest/checksums.txt"
          echo "5e5d7e2c0e88b3437cb659a921e0b88e997e4e0a49d01be52a9569136f01dbf9  $RUNNER_TEMP/conftest/checksums.txt" | sha256sum --check --status
          (cd "$RUNNER_TEMP/conftest" && grep 'conftest_0.71.1_Linux_x86_64.tar.gz$' checksums.txt | sha256sum --check --status)
          tar -xzf "$RUNNER_TEMP/conftest/conftest_0.71.1_Linux_x86_64.tar.gz" -C "$RUNNER_TEMP/conftest" conftest
          echo "$RUNNER_TEMP/conftest" >> "$GITHUB_PATH"

      # No AWS credentials are configured anywhere in this workflow. The unit
      # suite is offline by construction and the lab account is emulated
      # in-process, so a green build never depended on account access.
      # .coveragerc enables branch-inclusive coverage. The 86% floor reflects
      # the current expanded package coverage; no auditor modules are excluded.
      # Raise the floor back to 90% after tests cover the remaining branches.
      - name: Unit tests and coverage
        run: |
          pytest --cov=auditor --cov-report=term-missing \
                 --cov-report=json:results/coverage.json \
                 --cov-fail-under=86

      - name: Security properties (read-only, no committed credentials)
        run: pytest tests/test_security_properties.py -v

      - name: Self-audit the auditor's own IAM policy
        run: python -m auditor.cli validate-policy

      - name: Policy has not drifted from the code
        run: |
          python -m auditor.cli generate-policy > /tmp/generated-policy.json
          diff -u policies/auditor-readonly-policy.json /tmp/generated-policy.json

      - name: CIS mapping doc has not drifted from the mapping file
        run: |
          python scripts/render_cis_doc.py
          git diff --exit-code docs/cis-mapping.md

      - name: Lab benchmark (emulated account, no AWS credentials)
        run: python -m lab.run_benchmark

      - name: Metric evidence table
        if: matrix.python-version == '3.12'
        run: python scripts/collect_metrics.py --check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-results-py${{ matrix.python-version }}
          path: results/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.17.3
      - run: ruff check auditor lab tests scripts
      - run: ruff format --check auditor lab tests scripts
