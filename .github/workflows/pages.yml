# Publish the sample HTML report to GitHub Pages.
#
# The report is generated here rather than served from the committed copy, so
# the published page is always the output of the current code rather than of
# whenever someone last remembered to regenerate it. As everywhere else in this
# repository, the run has no AWS credentials: the account it audits is emulated
# in-process by moto.
#
# This needs Pages enabled once, by hand: Settings -> Pages -> Source: GitHub
# Actions. Until then the workflow's deploy step is the only thing that fails,
# and nothing else in CI depends on it.

name: Publish sample report

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate the report from the emulated lab account
        run: python -m lab.run_benchmark

      - name: Assemble the site
        run: |
          mkdir -p site
          cp results/aws_audit_report.html site/index.html
          # The report links to nothing, but the artifacts it was built from are
          # worth having beside it for anyone who wants to diff them.
          cp results/aws_audit_results.json results/aws_audit_results.csv site/
          # Jekyll would otherwise try to process the directory.
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
