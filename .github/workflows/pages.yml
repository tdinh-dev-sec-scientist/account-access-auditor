# Publish the demo site to GitHub Pages.
#
# The benchmark runs here rather than the committed artifacts being served, so
# the published page is always the output of the current code rather than of
# whenever someone last remembered to regenerate it. As everywhere else in this
# repository, the run has no AWS credentials: the account it audits is emulated
# in-process by moto.
#
# This needs Pages enabled once, by hand: Settings -> Pages -> Source: GitHub
# Actions. Until then the workflow's deploy step is the only thing that fails,
# and nothing else in CI depends on it.

name: Publish demo site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy mid-flight; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the benchmark against the emulated lab account
        run: python -m lab.run_benchmark

      - name: Build the site
        run: python scripts/build_site.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
