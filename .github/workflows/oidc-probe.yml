# Temporary experiment: does AWS IAM evaluate GitHub's workflow and ref OIDC
# claims in role trust policies? The three probe roles have no permissions;
# the job only asks AWS who it is. Delete this branch and the roles afterwards.
name: OIDC probe

on:
  push:
    branches: [chore/oidc-probe]

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [VorrinOidcProbeBaseline, VorrinOidcProbeClaims, VorrinOidcProbeWrongClaim]
    steps:
      - name: Assume ${{ matrix.role }}
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: arn:aws:iam::${{ vars.PHASE3_AWS_ACCOUNT_ID }}:role/${{ matrix.role }}
          aws-region: us-east-1
      - name: Report the assumed identity with the account masked
        run: aws sts get-caller-identity --query Arn --output text | sed -E 's/[0-9]{12}/XXXX/'
